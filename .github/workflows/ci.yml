name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      # The resources pages, downloads and sitemap are generated but
      # committed; fail if they are out of step with scripts/resources/.
      # og.png is left out: resvg's PNG bytes differ between platforms.
      - name: Check generated resources are up to date
        run: |
          node scripts/build-resources.mjs
          git status --porcelain -- public
          test -z "$(git status --porcelain -- public)"
