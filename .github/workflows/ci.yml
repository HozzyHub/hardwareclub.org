name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      # Generated output (resources pages, downloads, sitemap, og.png) is
      # committed; fail if it is out of step with its sources.
      - name: Check generated files are up to date
        run: |
          npm run build
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
